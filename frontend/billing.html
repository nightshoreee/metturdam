<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing | Mettur Dam Irrigation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
  @media print {
    #sidebar, .topbar, .no-print { display: none !important; }
    .main-content { margin-left: 0 !important; }
  }
</style>
</head>
<body>
<div id="sidebar"></div>
<div class="main-content">
  <div id="topbar" class="topbar"></div>
  <div class="page-content">
    <div id="alert-box"></div>

    <div class="panel no-print">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h2 class="h5 mb-0">All Bills</h2>
        <select class="form-select" id="filter-bill-status" style="max-width:220px;" onchange="loadBills()">
          <option value="">All statuses</option>
          <option>PAID</option><option>UNPAID</option><option>OVERDUE</option>
        </select>
      </div>
    </div>

    <div class="panel">
      <div class="table-responsive-wrap">
        <table class="data-table">
          <thead><tr>
            <th>Bill ID</th><th>Farmer</th><th>Water Used</th><th>Rate</th><th>Amount</th><th>Paid</th><th>Due Date</th><th>Status</th><th class="no-print">Actions</th>
          </tr></thead>
          <tbody id="bills-tbody"><tr><td colspan="9">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="billModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header no-print">
        <h5 class="modal-title">Bill</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="billModalBody">Loading...</div>
      <div class="modal-footer no-print">
        <button class="btn btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>renderLayout('billing');</script>
<script src="js/billing.js"></script>
</body>
</html>
