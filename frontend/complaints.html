<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complaints | Mettur Dam Irrigation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebar"></div>
<div class="main-content">
  <div id="topbar" class="topbar"></div>
  <div class="page-content">
    <div id="alert-box"></div>

    <div class="panel">
      <h2 class="h5">Submit a Complaint</h2>
      <div class="row g-3 align-items-end">
        <div class="col-md-3 form-section">
          <label class="form-label">Farmer</label>
          <select class="form-select" id="co-farmer-id"></select>
        </div>
        <div class="col-md-3 form-section">
          <label class="form-label">Related Schedule (optional)</label>
          <select class="form-select" id="co-schedule-id"><option value="">None</option></select>
        </div>
        <div class="col-md-3 form-section">
          <label class="form-label">Type</label>
          <select class="form-select" id="co-type">
            <option value="WATER_NOT_RECEIVED">Water Not Received</option>
            <option value="CANAL_BLOCKAGE">Canal Blockage</option>
            <option value="INCORRECT_BILLING">Incorrect Billing</option>
            <option value="SCHEDULE_ISSUE">Schedule Issue</option>
            <option value="INSUFFICIENT_WATER">Insufficient Water</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
        <div class="col-md-3 form-section">
          <button class="btn btn-primary w-100" onclick="submitComplaint()">Submit</button>
        </div>
        <div class="col-12 form-section">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="co-description" rows="2"></textarea>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="h5 mb-0">All Complaints</h2>
        <select class="form-select" id="filter-complaint-status" style="max-width:220px;" onchange="loadComplaints()">
          <option value="">All statuses</option>
          <option>OPEN</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>REJECTED</option>
        </select>
      </div>
      <div class="table-responsive-wrap">
        <table class="data-table">
          <thead><tr><th>ID</th><th>Farmer</th><th>Type</th><th>Description</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
          <tbody id="complaints-tbody"><tr><td colspan="7">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>renderLayout('complaints');</script>
<script src="js/complaints.js"></script>
</body>
</html>
