<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Parcels | Mettur Dam Irrigation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebar"></div>
<div class="main-content">
  <div id="topbar" class="topbar"></div>
  <div class="page-content">
    <div id="alert-box"></div>
    <div class="panel">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">All Land Parcels</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#parcelModal" onclick="openAddParcelModal()">
          <i class="bi bi-plus-lg"></i> Add Parcel
        </button>
      </div>
      <div class="table-responsive-wrap">
        <table class="data-table">
          <thead><tr>
            <th>ID</th><th>Farmer</th><th>Crop</th><th>Area (acres)</th><th>Required Water</th><th>Location</th><th>Soil</th><th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody id="parcels-tbody"><tr><td colspan="9">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="parcelModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="parcelModalTitle">Add Land Parcel</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="p-parcel-id">
        <div class="mb-3">
          <label class="form-label">Farmer</label>
          <select class="form-select" id="p-farmer-id"></select>
        </div>
        <div class="mb-3">
          <label class="form-label">Crop</label>
          <select class="form-select" id="p-crop-id"></select>
        </div>
        <div class="mb-3"><label class="form-label">Area (acres)</label><input type="number" step="0.01" class="form-control" id="p-area"></div>
        <div class="mb-3"><label class="form-label">Location</label><input class="form-control" id="p-location"></div>
        <div class="mb-3"><label class="form-label">Soil Type</label><input class="form-control" id="p-soil"></div>
        <div class="mb-3">
          <label class="form-label">Status</label>
          <select class="form-select" id="p-status"><option>ACTIVE</option><option>FALLOW</option><option>INACTIVE</option></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveParcel()">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>renderLayout('parcels');</script>
<script src="js/parcels.js"></script>
</body>
</html>
