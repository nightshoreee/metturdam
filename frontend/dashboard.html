<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Mettur Dam Irrigation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
</head>
<body>
<div id="sidebar"></div>
<div class="main-content">
  <div id="topbar" class="topbar"></div>
  <div class="page-content">
    <div id="alert-box"></div>

    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Dam Water Level</div><div class="stat-value" id="stat-dam-level">-</div></div>
      <div class="stat-card"><div class="stat-label">Available Water</div><div class="stat-value" id="stat-available-water">-</div></div>
      <div class="stat-card"><div class="stat-label">Active Canals</div><div class="stat-value" id="stat-active-canals">-</div></div>
      <div class="stat-card"><div class="stat-label">Today's Schedules</div><div class="stat-value" id="stat-today-schedules">-</div></div>
      <div class="stat-card"><div class="stat-label">Pending Requests</div><div class="stat-value" id="stat-pending">-</div></div>
      <div class="stat-card"><div class="stat-label">Total Water Used</div><div class="stat-value" id="stat-total-used">-</div></div>
      <div class="stat-card"><div class="stat-label">Outstanding Bills</div><div class="stat-value" id="stat-outstanding">-</div></div>
      <div class="stat-card"><div class="stat-label">Open Complaints</div><div class="stat-value" id="stat-open-complaints">-</div></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card"><h3>Dam Water Level Over Time</h3><canvas id="chart-dam-level"></canvas></div>
      <div class="chart-card"><h3>Water Usage by Canal</h3><canvas id="chart-usage-canal"></canvas></div>
      <div class="chart-card"><h3>Crop-wise Water Requirement</h3><canvas id="chart-crop-water"></canvas></div>
      <div class="chart-card"><h3>Scheduled vs Actual Usage (recent)</h3><canvas id="chart-scheduled-actual"></canvas></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>renderLayout('dashboard');</script>
<script src="js/dashboard.js"></script>
</body>
</html>
