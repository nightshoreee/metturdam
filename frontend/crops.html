<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crops | Mettur Dam Irrigation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebar"></div>
<div class="main-content">
  <div id="topbar" class="topbar"></div>
  <div class="page-content">
    <div id="alert-box"></div>
    <div class="panel">
      <p class="text-muted small">Water requirement figures below are illustrative academic values for this demo project, not official Tamil Nadu Water Resources Department allocations.</p>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">All Crops</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#cropModal" onclick="openAddCropModal()">
          <i class="bi bi-plus-lg"></i> Add Crop
        </button>
      </div>
      <div class="table-responsive-wrap">
        <table class="data-table">
          <thead><tr>
            <th>ID</th><th>Crop</th><th>Water Req. / Acre</th><th>Duration (days)</th><th>Season</th><th>Actions</th>
          </tr></thead>
          <tbody id="crops-tbody"><tr><td colspan="6">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="cropModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="cropModalTitle">Add Crop</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="c-crop-id">
        <div class="mb-3"><label class="form-label">Crop Name</label><input class="form-control" id="c-name"></div>
        <div class="mb-3"><label class="form-label">Water Requirement per Acre (litres)</label><input type="number" step="0.01" class="form-control" id="c-water"></div>
        <div class="mb-3"><label class="form-label">Duration (days)</label><input type="number" class="form-control" id="c-duration"></div>
        <div class="mb-3">
          <label class="form-label">Season</label>
          <select class="form-select" id="c-season"><option>KHARIF</option><option>RABI</option><option>SUMMER</option><option>YEAR_ROUND</option></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveCrop()">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>renderLayout('crops');</script>
<script src="js/crops.js"></script>
</body>
</html>
