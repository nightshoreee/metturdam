<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments | Mettur Dam Irrigation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebar"></div>
<div class="main-content">
  <div id="topbar" class="topbar"></div>
  <div class="page-content">
    <div id="alert-box"></div>

    <div class="panel">
      <h2 class="h5">Record a Payment</h2>
      <p class="text-muted small">No real online payment processing -- this is an academic simulation only.</p>
      <div class="row g-3 align-items-end">
        <div class="col-md-5 form-section">
          <label class="form-label">Unpaid Bill</label>
          <select class="form-select" id="pay-bill-id" onchange="onBillChange()"></select>
        </div>
        <div class="col-md-3 form-section">
          <label class="form-label">Amount (Rs.)</label>
          <input type="number" step="0.01" class="form-control" id="pay-amount">
        </div>
        <div class="col-md-2 form-section">
          <label class="form-label">Mode</label>
          <select class="form-select" id="pay-mode"><option>CASH</option><option>UPI</option><option>BANK_TRANSFER</option></select>
        </div>
        <div class="col-md-2 form-section">
          <button class="btn btn-primary w-100" onclick="recordPayment()">Pay</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2 class="h5">Payment History</h2>
      <div class="table-responsive-wrap">
        <table class="data-table">
          <thead><tr><th>ID</th><th>Bill</th><th>Amount</th><th>Date</th><th>Mode</th><th>Status</th></tr></thead>
          <tbody id="payments-tbody"><tr><td colspan="6">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>renderLayout('payments');</script>
<script src="js/payments.js"></script>
</body>
</html>
